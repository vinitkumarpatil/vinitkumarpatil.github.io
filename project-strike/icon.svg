<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c1020;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06080e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff3e55;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6070;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Subtle grid lines -->
  <g opacity="0.08" stroke="#ff3e55" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>
  <!-- Diamond accent -->
  <polygon points="256,60 296,96 256,132 216,96" fill="none" stroke="#ff3e55" stroke-width="3" opacity="0.5"/>
  <!-- VK text -->
  <text x="256" y="285" font-family="Arial Black, sans-serif" font-size="156" font-weight="900"
        text-anchor="middle" fill="white" filter="url(#glow)" letter-spacing="4">VK</text>
  <!-- TRAP text -->
  <text x="256" y="375" font-family="Arial Black, sans-serif" font-size="88" font-weight="900"
        text-anchor="middle" fill="url(#accent)" filter="url(#glow)" letter-spacing="12">TRAP</text>
  <!-- Bottom accent line -->
  <rect x="96" y="415" width="320" height="4" rx="2" fill="url(#accent)" opacity="0.7"/>
</svg>
