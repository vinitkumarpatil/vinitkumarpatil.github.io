<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff4655">
  <meta name="description" content="Project Strike: AAA-grade 3D browser battle shooter with 10,000 campaign levels and Battle Royale survival.">
  <title>PROJECT STRIKE | 3D Battle Shooter</title>
  <link rel="manifest" href="./assets/manifest-DiQVpED8.json">
  <style>
    :root {
      --bg-dark: #090b0e;
      --bg-panel: rgba(16, 20, 26, 0.88);
      --accent-red: #ff4655;
      --accent-cyan: #00e5ff;
      --accent-green: #00ff88;
      --accent-gold: #ffaa00;
      --text-main: #f0f4f8;
      --text-muted: #7e8b9b;
      --border-color: rgba(255, 255, 255, 0.12);
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: var(--font-family);
      color: var(--text-main);
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Loading Screen */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #090b0e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    .loading-logo {
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 25px;
      text-shadow: 0 0 20px rgba(255, 70, 85, 0.6);
    }
    .loading-logo span { color: var(--accent-red); }

    .loading-bar-bg {
      width: 280px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    #loading-bar-fill {
      width: 15%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-red), var(--accent-cyan));
      transition: width 0.1s ease;
    }
    .loading-text {
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: var(--text-muted);
    }

    /* Buttons */
    .cyber-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: #fff;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      letter-spacing: 1px;
      transition: all 0.2s;
    }
    .cyber-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--accent-cyan);
    }
    .cyber-btn.primary {
      background: var(--accent-red);
      border-color: var(--accent-red);
    }
    .cyber-btn.primary:hover {
      background: #ff5e6c;
      box-shadow: 0 0 15px rgba(255, 70, 85, 0.5);
    }
    .cyber-btn.accent {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
      color: #000;
    }
    .cyber-btn.danger {
      background: #c62828;
      border-color: #c62828;
    }
    .cyber-btn.large {
      padding: 14px 28px;
      font-size: 1rem;
      width: 100%;
      margin-top: 15px;
    }

    /* Main Menu */
    #main-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      z-index: 100;
      background: radial-gradient(circle at center, #131922 0%, #080a0d 100%);
    }

    #menu-header {
      height: 65px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--border-color);
      background: rgba(10, 12, 16, 0.95);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .brand .accent { color: var(--accent-red); }
    .brand .logo-symbol { color: var(--accent-cyan); font-size: 1.5rem; }

    .nav-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 1px;
      padding: 8px 14px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .nav-btn:hover, .nav-btn.active {
      color: #fff;
      border-color: var(--accent-red);
    }

    .header-user-badge {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .currency { color: var(--accent-gold); }
    .user-lvl {
      background: rgba(0, 229, 255, 0.15);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      padding: 3px 8px;
      border-radius: 3px;
    }

    #menu-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .menu-tab-pane {
      display: none;
      width: 100%;
      max-width: 960px;
    }
    .menu-tab-pane.active {
      display: block;
    }

    /* Home Hero */
    .hero-banner {
      text-align: center;
    }
    .hero-badge {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--accent-cyan);
      margin-bottom: 10px;
      border: 1px solid rgba(0, 229, 255, 0.4);
      padding: 4px 12px;
      border-radius: 20px;
    }
    .hero-title {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }
    .hero-desc {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 30px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .mode-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      text-align: left;
    }
    .mode-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
      position: relative;
      transition: all 0.25s;
    }
    .mode-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-red);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .mode-card.br-card:hover {
      border-color: var(--accent-cyan);
    }
    .card-tag {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--accent-green);
      margin-bottom: 8px;
    }
    .br-tag { color: var(--accent-cyan); }
    .mode-card h3 {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }
    .mode-card p {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.4;
      margin-bottom: 15px;
    }

    /* Campaign Tab */
    .campaign-header {
      margin-bottom: 20px;
    }
    .level-jump-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--bg-panel);
      padding: 16px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      margin-bottom: 20px;
    }
    .level-jump-bar input {
      width: 100px;
      background: #0d1117;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
    }
    .preview-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 6px;
    }
    .tier-pill {
      font-weight: 800;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }
    .preview-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin: 15px 0;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    /* Armory Tab */
    .armory-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 20px;
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      min-height: 380px;
    }
    .weapons-sidebar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 8px;
    }
    .armory-item {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
    }
    .armory-item:hover, .armory-item.active {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent-cyan);
    }
    .armory-item .w-name { font-weight: 700; font-size: 0.9rem; }
    .armory-item .w-cat { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    .weapon-details-pane {
      padding-left: 20px;
      border-left: 1px solid var(--border-color);
    }
    .armory-cat { color: var(--accent-cyan); font-size: 0.85rem; margin-bottom: 15px; }
    .stat-bars { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .stat-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.85rem; }
    .stat-row .bar-bg { width: 60%; height: 8px; background: #1a2028; border-radius: 4px; overflow: hidden; }
    .stat-row .bar-fill { height: 100%; background: var(--accent-cyan); width: 50%; }
    .armory-actions { display: flex; gap: 10px; }

    /* Profile & Settings & Multiplayer */
    .profile-grid, .settings-card, .mp-lobby-container {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 24px;
    }
    .profile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 15px;
    }
    .p-item { background: rgba(0,0,0,0.3); padding: 12px; border-radius: 4px; }
    .p-item .lbl { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .p-item .val { font-size: 1.1rem; font-weight: bold; color: var(--accent-cyan); }

    .setting-group { margin: 15px 0; display: flex; flex-direction: column; gap: 6px; }
    .setting-group label { font-size: 0.85rem; color: var(--text-muted); }
    .setting-group input[type="range"] { accent-color: var(--accent-red); }
    .cyber-select { background: #0c0e12; border: 1px solid var(--border-color); color: #fff; padding: 8px; border-radius: 4px; }
    .save-management { display: flex; gap: 10px; margin-top: 25px; flex-wrap: wrap; }

    .achievements-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    .achievement-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      padding: 14px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .achievement-card.unlocked { border-color: var(--accent-green); background: rgba(0, 255, 136, 0.05); }
    .ach-icon { font-size: 1.6rem; }
    .ach-info h4 { font-size: 0.9rem; margin-bottom: 2px; }
    .ach-info p { font-size: 0.75rem; color: var(--text-muted); }
    .ach-status { margin-left: auto; font-size: 0.7rem; font-weight: 800; color: var(--text-muted); }
    .achievement-card.unlocked .ach-status { color: var(--accent-green); }

    /* In-Game HUD */
    #game-hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    #hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    #compass-container {
      background: rgba(10, 15, 20, 0.7);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
    #match-info-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(10, 15, 20, 0.7);
      border: 1px solid var(--border-color);
      padding: 6px 16px;
      border-radius: 4px;
    }
    #hud-level-badge { font-weight: 800; color: var(--accent-cyan); font-size: 0.85rem; }
    #hud-objective-desc { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    #br-info-badge {
      display: flex;
      gap: 12px;
      background: rgba(10, 15, 20, 0.7);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 4px;
    }
    .br-stat .label { font-size: 0.65rem; color: var(--text-muted); display: block; }
    .br-stat .val { font-size: 0.95rem; font-weight: bold; color: var(--accent-gold); }

    /* Boss Bar */
    #boss-hud-container {
      width: 450px;
      max-width: 90%;
      margin: 10px auto 0;
      text-align: center;
    }
    #boss-name { font-size: 0.85rem; font-weight: 800; letter-spacing: 2px; color: #ff3344; margin-bottom: 4px; }
    .boss-bar-bg {
      height: 12px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #ff3344;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    #boss-hp-fill { height: 100%; background: #ff3344; width: 100%; transition: width 0.1s; }
    #boss-shield-fill { position: absolute; top: 0; left: 0; height: 100%; background: #00e5ff; width: 100%; opacity: 0.8; }

    /* Kill Feed */
    #kill-feed-container {
      position: absolute;
      top: 75px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .kill-feed-item {
      background: rgba(0, 0, 0, 0.65);
      border-left: 3px solid var(--accent-red);
      padding: 4px 10px;
      font-size: 0.75rem;
      border-radius: 2px;
      animation: fadeIn 0.2s ease;
    }
    .kill-feed-item .killer { color: var(--accent-green); font-weight: bold; }
    .kill-feed-item .victim { color: #ff5566; font-weight: bold; }

    /* Crosshair */
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      width: 32px;
      height: 32px;
    }
    .ch-part { position: absolute; background: #00ff88; border-radius: 1px; transition: transform 0.1s ease; }
    .ch-top { width: 2px; height: 8px; top: 0; left: 15px; }
    .ch-bottom { width: 2px; height: 8px; bottom: 0; left: 15px; }
    .ch-left { height: 2px; width: 8px; left: 0; top: 15px; }
    .ch-right { height: 2px; width: 8px; right: 0; top: 15px; }
    .ch-dot { width: 2px; height: 2px; top: 15px; left: 15px; background: #fff; }

    #crosshair.moving .ch-top { transform: translateY(-4px); }
    #crosshair.moving .ch-bottom { transform: translateY(4px); }
    #crosshair.moving .ch-left { transform: translateX(-4px); }
    #crosshair.moving .ch-right { transform: translateX(4px); }
    #crosshair.ads-active .ch-part { opacity: 0.35; }

    .hitmarker-x {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 20px;
      height: 20px;
      transform: translate(-50%, -50%) rotate(45deg);
      display: none;
    }
    .hitmarker-x.active { display: block; }
    .hitmarker-x::before, .hitmarker-x::after {
      content: '';
      position: absolute;
      background: #fff;
    }
    .hitmarker-x::before { width: 2px; height: 100%; left: 9px; }
    .hitmarker-x::after { height: 2px; width: 100%; top: 9px; }
    .hitmarker-x.headshot::before, .hitmarker-x.headshot::after { background: #ff2233; }

    /* Damage Vignette */
    #damage-vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      box-shadow: inset 0 0 80px rgba(255, 0, 0, 0.8);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 40;
    }

    /* Damage numbers */
    .damage-popup {
      position: fixed;
      color: #ffff00;
      font-weight: 900;
      font-size: 1.2rem;
      pointer-events: none;
      text-shadow: 0 0 5px #000, 1px 1px 2px #000;
      z-index: 60;
    }
    .damage-popup.headshot {
      color: #ff3344;
      font-size: 1.6rem;
    }

    /* Bottom HUD */
    #hud-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    #hud-vitals {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 220px;
      background: rgba(10, 15, 20, 0.7);
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .bar-group { display: flex; align-items: center; gap: 8px; }
    .bar-icon { font-size: 0.9rem; }
    .meter-bg { flex: 1; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
    .meter-fill { height: 100%; border-radius: 4px; transition: width 0.1s; }
    .meter-fill.armor { background: var(--accent-cyan); width: 50%; }
    .meter-fill.health { background: var(--accent-green); width: 100%; }
    .meter-fill.stamina { background: var(--accent-gold); width: 100%; }
    .meter-num { font-size: 0.8rem; font-weight: bold; width: 30px; text-align: right; }

    #hud-weapon {
      text-align: center;
      background: rgba(10, 15, 20, 0.7);
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 6px;
    }
    #weapon-name-display { font-weight: 800; font-size: 1.1rem; color: #fff; }
    #ammo-display { font-size: 1.6rem; font-weight: 900; }
    #ammo-mag { color: var(--accent-cyan); }
    .ammo-slash { color: var(--text-muted); font-size: 1.2rem; }
    #ammo-reserve { color: var(--text-muted); font-size: 1.1rem; }
    #medkit-counter { font-size: 0.85rem; color: var(--accent-green); margin-top: 4px; font-weight: bold; }

    #minimap-wrapper {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid var(--border-color);
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }

    /* Game Over Overlay */
    #game-over-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      pointer-events: auto;
    }
    .overlay-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 32px;
      text-align: center;
      max-width: 440px;
      width: 90%;
    }
    .overlay-card h1 { font-size: 2rem; font-weight: 900; margin-bottom: 8px; }
    .overlay-card p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px; }
    #game-over-rewards {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 24px;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent-gold);
    }
    .overlay-buttons { display: flex; flex-direction: column; gap: 10px; }

    /* Performance Monitor */
    #perf-monitor {
      position: fixed;
      bottom: 8px;
      left: 8px;
      background: rgba(0,0,0,0.6);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-family: monospace;
      color: var(--accent-green);
      pointer-events: none;
      z-index: 90;
    }

    /* Mobile Touch Controls */
    #touch-controls-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 80;
    }
    #joystick-zone {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 45%;
      height: 65%;
      pointer-events: auto;
    }
    #joystick-base {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.25);
      background: rgba(0, 0, 0, 0.35);
      transform: translate(-50%, -50%);
      display: none;
      pointer-events: none;
    }
    #joystick-stick {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
      transform: translate(-50%, -50%);
    }

    #touch-actions {
      position: absolute;
      right: 16px;
      bottom: 20px;
      display: grid;
      grid-template-columns: repeat(3, 58px);
      gap: 12px;
      pointer-events: auto;
    }
    .touch-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(20, 26, 35, 0.75);
